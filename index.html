<style>
:root{--bg:#F4EFE7;--bg2:#EAE2D5;--ink:#1E1B18;--mute:#7B7167;--line:#D8CEBF;--acc:#A94F33;--on:#F4EFE7;

:root[data-theme="dark"]{--bg:#17140F;--bg2:#221E18;--ink:#EFE8DC;--mute:#9C9184;--line:#3A332A;--acc:#D9825F;--on:#17140F}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none;cursor:pointer}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
.w{max-width:1280px;margin:0 auto;padding:0 32px}
h1,h2,h3,.serif{font-family:var(--serif);font-weight:300;letter-spacing:-.02em;line-height:1.05}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-family:var(--serif);font-size:24px;letter-spacing:-.03em}.logo i{color:var(--acc)}
.links{display:flex;gap:32px;align-items:center}.links a{font-size:13px;letter-spacing:.04em;padding:4px 0;border-bottom:1px solid transparent}
.links a:hover,.links a.on{border-color:var(--ink)}
.cartb{display:flex;gap:8px;align-items:center;font-size:13px}.cartb b{background:var(--ink);color:var(--on);border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:11px;font-weight:500}
.burger{display:none;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--ink);color:var(--on);padding:15px 28px;font-size:13px;letter-spacing:.06em;border-radius:0;transition:.25s}
.btn:hover{background:var(--acc)}.btn.o{background:none;color:var(--ink);border:1px solid var(--ink)}.btn.o:hover{background:var(--ink);color:var(--on)}
.btn[disabled]{opacity:.4;pointer-events:none}
.ul{border-bottom:1px solid var(--ink);padding-bottom:2px;font-size:13px;letter-spacing:.04em;transition:.2s}.ul:hover{color:var(--acc);border-color:var(--acc)}
/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;padding:72px 0 96px;align-items:end}
.hero h1{font-size:clamp(52px,8vw,120px)}.hero h1 em{color:var(--acc);font-style:italic}
.hero p{max-width:420px;color:var(--mute);margin:32px 0 36px;font-size:16px}
.hc{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}.hc>:nth-child(2){margin-top:64px}
.sec{padding:80px 0;border-top:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px;gap:20px}.sh h2{font-size:clamp(34px,4.5vw,56px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:48px 32px}.grid.g4{grid-template-columns:repeat(4,1fr)}
.card{display:block}.frame{position:relative;overflow:hidden;background:var(--bg2);aspect-ratio:4/5}
.frame svg{width:100%;height:100%;display:block;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.card:hover .frame svg{transform:scale(1.06)}
.frame .v{position:absolute;left:0;right:0;bottom:0;padding:14px 18px;background:var(--ink);color:var(--on);font-size:12px;letter-spacing:.12em;text-transform:uppercase;transform:translateY(101%);transition:.4s;display:flex;justify-content:space-between}
.card:hover .v{transform:none}
.cap{display:flex;justify-content:space-between;gap:16px;padding-top:14px}.cap h3{font-size:21px;font-weight:400}.cap small{color:var(--mute);font-size:13px;display:block;margin-top:2px}.cap span{font-size:14px;white-space:nowrap;padding-top:4px}
.sold{color:var(--acc)}
.quote{font-family:var(--serif);font-size:clamp(28px,4vw,52px);font-weight:300;line-height:1.15;max-width:960px;letter-spacing:-.02em}.quote em{color:var(--acc)}
.arts{display:grid;grid-template-columns:repeat(4,1fr);gap:32px}
.art{display:block}.art .ph{aspect-ratio:1;overflow:hidden;background:var(--bg2);margin-bottom:14px}.art .ph svg{width:100%;height:100%;transition:transform 1s}.art:hover svg{transform:scale(1.07)}
.art h3{font-size:22px;font-weight:400}.art small{color:var(--mute)}
/* explore */
.ph1{padding:64px 0 40px}.ph1 h1{font-size:clamp(44px,7vw,92px)}
.fbar{display:flex;gap:24px 40px;flex-wrap:wrap;padding:20px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:48px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 16px;border:1px solid var(--line);border-radius:99px;font-size:13px;transition:.2s}.chip:hover{border-color:var(--ink)}.chip.on{background:var(--ink);color:var(--on);border-color:var(--ink)}

select{width:auto;padding-right:8px;font-size:13px}select option{background:var(--bg);color:var(--ink)}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block}
.fg{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.empty{padding:80px 0;text-align:center;color:var(--mute)}
/* detail */
.det{display:grid;grid-template-columns:1.2fr 1fr;gap:80px;padding:56px 0 96px;align-items:start}
.det .big{background:var(--bg2);aspect-ratio:4/5;overflow:hidden}.det .big svg{width:100%;height:100%;display:block}
.det .info{position:sticky;top:110px}.det h1{font-size:clamp(40px,5vw,68px);margin:12px 0 8px}
.price{font-family:var(--serif);font-size:34px;font-weight:300;margin:28px 0}
dl{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line);margin:28px 0}dt,dd{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}dt{color:var(--mute)}
.crumb{font-size:12px;color:var(--mute);padding-top:28px}.crumb a:hover{color:var(--ink)}
.note{font-size:13px;color:var(--mute);margin-top:18px}

.ah{display:grid;grid-template-columns:1fr 1.1fr;gap:80px;padding:64px 0 80px;align-items:end}.ah h1{font-size:clamp(48px,7vw,96px)}

.mono{aspect-ratio:1;display:grid;place-items:center;background:var(--bg2);font-family:var(--serif);font-size:min(24vw,260px);font-weight:300;color:var(--acc)}
/* about, forms */
.two{display:grid;grid-template-columns:1fr 1fr;gap:80px}.prose p{margin-bottom:20px;color:var(--mute);font-size:16px;max-width:520px}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:32px;margin-top:64px}.nums b{font-family:var(--serif);font-size:64px;font-weight:300;display:block;line-height:1;color:var(--acc)}
.form{display:grid;gap:28px}.row{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.steps{display:flex;gap:12px;margin-bottom:40px}.steps div{flex:1;border-top:2px solid var(--line);padding-top:10px;font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}.steps .on{border-color:var(--ink);color:var(--ink)}
.drop{border:1px dashed var(--mute);padding:48px;text-align:center;color:var(--mute);transition:.2s}.drop:hover{border-color:var(--acc);color:var(--acc)}
.pay{display:flex;gap:8px;flex-wrap:wrap}
/* cart */
.cl{display:grid;grid-template-columns:1.5fr 1fr;gap:80px;padding-bottom:96px;align-items:start}
.ci{display:grid;grid-template-columns:96px 1fr auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}.ci .t{width:96px;aspect-ratio:4/5;overflow:hidden}.ci svg{width:100%;height:100%;display:block}.ci h3{font-size:20px;font-weight:400}
.sum{background:var(--bg2);padding:32px;position:sticky;top:100px}.sum .l{display:flex;justify-content:space-between;padding:8px 0;font-size:14px}.sum .tt{border-top:1px solid var(--ink);margin-top:12px;padding-top:16px;font-family:var(--serif);font-size:26px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--on);padding:14px 22px;font-size:13px;z-index:40;display:flex;gap:20px;align-items:center}
footer{border-top:1px solid var(--line);padding:56px 0 40px;margin-top:0}footer .fr{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap}footer p{color:var(--mute);font-size:13px;max-width:320px;margin-top:10px}
@media(max-width:900px){.w{padding:0 20px}.links{display:none;position:absolute;top:68px;left:0;right:0;background:var(--bg);flex-direction:column;align-items:flex-start;padding:20px;gap:18px;border-bottom:1px solid var(--line)}.links.open{display:flex}.burger{display:block}
.hero,.det,.ah,.two,.cl{grid-template-columns:1fr;gap:40px}.hero{padding:40px 0 64px}.grid,.grid.g4,.arts{grid-template-columns:1fr 1fr;gap:32px 16px}.det .info,.sum{position:static}.nums{grid-template-columns:1fr}.row{grid-template-columns:1fr}.sec{padding:56px 0}.cap{flex-direction:column;gap:0}.stats{gap:28px}}
@media(max-width:520px){.grid,.grid.g4{grid-template-columns:1fr}.arts{grid-template-columns:1fr 1fr}.ci{grid-template-columns:72px 1fr}.ci>:last-child{grid-column:2}.ci .t{width:72px}}
/* ---- Editorial Art Showcase design system ---- */
html:root:not([data-theme="none"]){--bg:#E5E5E5;--bg2:#F8F8F8;--ink:#121212;--mute:#5A5A5A;--line:#D4D4D4;--acc:#8E0E00;--on:#FFFFFF;--gold:#F59E0B;--serif:'Source Serif 4',Georgia,serif;--sans:'Chivo',system-ui,sans-serif;--mono:'Space Grotesk',ui-monospace,monospace}

.grid,.arts{counter-reset:n}.card,.art{counter-increment:n}
.card .cap h3,.art h3{font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.01em}

.cap{border-top:1px solid var(--ink);margin-top:14px;padding-top:12px}.cap small{font-size:10px;color:var(--mute)}.cap span{font-size:12px}

const ARTISTS=[

function App(){const [route,setRoute]=useState(location.hash.slice(1)||'home'),[cart,setCart]=useState([]),[sup,setSup]=useState(null),[follows,setFollows]=useState([]),[msgs,setMsgs]=useState([]),[open,setOpen]=useState(false),[toast,setToast]=useState(null);
